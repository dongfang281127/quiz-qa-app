<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <!-- 部署在子目录时必须由 --base-href 覆盖这一行（本项目的构建命令是 /quiz/app/） -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="问道题库 Web 版：学科 → 章节 → 题目，答完即时判分，章节进度与正确率自动记录。Flutter 编译，数据在你自己的 Cloudflare Worker 上。">
  <meta name="theme-color" content="#2E7D32">
  <meta name="color-scheme" content="light dark">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="问道题库">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>问道题库 · Q&amp;A</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* 首屏加载态：Flutter 引擎起来之前先把底色和 logo 摆好，避免白屏闪一下 */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #F7FBF4;
    }
    @media (prefers-color-scheme: dark) {
      html, body { background: #0A1612; }
      #boot-text { color: #8FB89B; }
    }
    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif;
    }
    #boot img {
      width: 88px;
      height: 88px;
      border-radius: 22px;
      box-shadow: 0 12px 30px -14px rgba(8, 32, 26, .35);
    }
    #boot-ring {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(46, 125, 50, .22);
      border-top-color: #2E7D32;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    #boot-text {
      font-size: 13px;
      letter-spacing: .04em;
      color: #5C7D70;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="boot">
    <img src="icons/Icon-192.png" alt="问道题库">
    <div id="boot-ring"></div>
    <div id="boot-text">正在加载题库…</div>
  </div>

  <script>
    // Flutter 首次渲染后把占位层撤掉
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('boot');
      if (boot) boot.remove();
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
