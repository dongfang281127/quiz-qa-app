<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <!-- 部署在子目录时必须由 --base-href 覆盖这一行（本项目的构建命令是 /quiz/app/） -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="问道题库 Web 版：学科 → 章节 → 题目，答完即时判分，章节进度与正确率自动记录。Flutter 编译，数据在你自己的 Cloudflare Worker 上。">
  <meta name="theme-color" content="#2E7D32">
  <meta name="color-scheme" content="light dark">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="问道题库">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>问道题库 · Q&amp;A</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* 首屏加载态：Flutter 引擎起来之前先把底色和 logo 摆好，避免白屏闪一下 */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #F7FBF4;
    }
    @media (prefers-color-scheme: dark) {
      html, body { background: #0A1612; }
      #boot-text { color: #8FB89B; }
    }
    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif;
    }
    #boot img {
      width: 88px;
      height: 88px;
      border-radius: 22px;
      box-shadow: 0 12px 30px -14px rgba(8, 32, 26, .35);
    }
    #boot-ring {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(46, 125, 50, .22);
      border-top-color: #2E7D32;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    #boot-text {
      font-size: 13px;
      letter-spacing: .04em;
      color: #5C7D70;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="boot">
    <img src="icons/Icon-192.png" alt="问道题库">
    <div id="boot-ring"></div>
    <div id="boot-text">正在加载题库…</div>
  </div>

  <script>
    // Flutter 首次渲染后把占位层撤掉
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('boot');
      if (boot) boot.remove();
    });
  </script>
  <!-- 独立打开时的返回出口；被站点 iframe 内嵌时自动隐藏 -->
  <style>
    #station-back {
      position: fixed;
      left: 14px;
      bottom: 14px;
      z-index: 2147483000;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 9px 14px;
      border-radius: 999px;
      font: 600 12.5px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif;
      color: #0F2E24;
      background: rgba(255, 255, 255, .93);
      border: 1px solid rgba(15, 46, 36, .14);
      box-shadow: 0 10px 26px -14px rgba(8, 32, 26, .55);
      text-decoration: none;
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      transition: transform .18s ease, box-shadow .18s ease;
    }
    #station-back:hover { transform: translateY(-1px); box-shadow: 0 14px 30px -14px rgba(8, 32, 26, .6); }
    @media (prefers-color-scheme: dark) {
      #station-back { color: #CFF3DC; background: rgba(16, 34, 27, .9); border-color: rgba(143, 184, 155, .28); }
    }
    body.embedded #station-back { display: none; }
  </style>
  <a id="station-back" href="/quiz/quiz_home.html">
    <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
    返回空间站
  </a>

  <script>
    // 被站点 iframe 内嵌时（window.top 不是自己），把返回按钮藏掉，避免和外层工具条重复
    if (window.self !== window.top) {
      document.body.classList.add('embedded');
    }
    // 独立打开时点返回，优先走浏览器历史，兜底回介绍页
    document.getElementById('station-back').addEventListener('click', function (e) {
      if (window.history.length > 1) {
        e.preventDefault();
        window.history.back();
        setTimeout(function () { location.href = '/quiz/quiz_home.html'; }, 400);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
